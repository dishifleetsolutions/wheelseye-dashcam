<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wheelseye Dashcam</title>

<style>
body {
  margin:0;
  font-family: Arial;
  background:#0a0f2e;
  color:white;
}

/* HERO */
.hero {
  padding:60px 20px;
  text-align:center;
}
.hero h1 {
  font-size:40px;
}
.hero span {
  color:#00d4ff;
}
.btn {
  background:#e8192c;
  padding:14px 25px;
  color:white;
  text-decoration:none;
  display:inline-block;
  margin-top:20px;
}

/* VIDEO */
.video {
  padding:40px;
  text-align:center;
}
iframe {
  width:90%;
  height:300px;
}

/* FORM */
.form {
  padding:40px;
  text-align:center;
}
input {
  padding:12px;
  margin:10px;
  width:250px;
}
button {
  padding:12px 20px;
  background:red;
  color:white;
  border:none;
}

/* WHATSAPP */
.whatsapp {
  position:fixed;
  bottom:20px;
  right:20px;
  background:#25D366;
  padding:12px 18px;
  border-radius:30px;
  color:white;
  text-decoration:none;
}

/* TICKER */
.ticker {
  position:fixed;
  bottom:80px;
  left:20px;
  background:black;
  padding:10px 15px;
  border-radius:20px;
  font-size:13px;
}
</style>
</head>

<body>

<!-- HERO -->
<div class="hero">
  <h1>WHEELS EYE <span>DASHCAM</span></h1>
  <p>Live tracking with inbuilt SIM. No hotspot needed.</p>
  <a href="#form" class="btn">Get Demo</a>
</div>

<!-- VIDEO -->
<div class="video">
  <h2>Live Demo</h2>
  <iframe src="https://www.youtube.com/embed/YOUR_VIDEO_ID"></iframe>
</div>

<!-- FORM -->
<div class="form" id="form">
  <h2>Get Free Demo</h2>
  <form id="leadForm">
    <input type="text" name="name" placeholder="Name" required><br>
    <input type="tel" name="phone" placeholder="Phone" required><br>
    <button type="submit">Submit</button>
  </form>
</div>

<!-- BLOG LINK -->
<div style="text-align:center;padding:30px;">
  <a href="/blog/" class="btn">Read Blog</a>
</div>

<!-- WHATSAPP -->
<a href="https://wa.me/919851991099" class="whatsapp">Chat</a>

<!-- TICKER -->
<div class="ticker" id="ticker">
  Someone from Kolkata booked
</div>

<script>
// GOOGLE SHEET CONNECT
document.getElementById("leadForm").addEventListener("submit", function(e){
  e.preventDefault();

  fetch("YOUR_WEB_APP_URL", {
    method:"POST",
    body: JSON.stringify({
      name:this.name.value,
      phone:this.phone.value
    })
  }).then(()=>alert("Submitted"));
});

// TICKER
const msgs = [
 "Rahul from Kolkata booked",
 "Truck owner from Delhi ordered",
 "Fleet from Mumbai installed",
 "Driver from Patna ordered"
];

setInterval(()=>{
 document.getElementById("ticker").innerText =
 msgs[Math.floor(Math.random()*msgs.length)];
},5000);
</script>

</body>
</html>
