<!DOCTYPE html>
<html>
<head>
  <title>Blog - Wheelseye</title>
</head>
<body style="background:#0a0f2e;color:white;font-family:sans-serif;padding:40px">

<h1>🚛 Wheelseye Blog</h1>
<div id="posts"></div>

<script>
fetch('/posts/index.json')
.then(res => res.json())
.then(posts => {
  let html = '';
  posts.reverse().forEach(p => {
    html += `
      <div style="margin-bottom:30px;">
        <h2>${p.title}</h2>
        <small>${p.date}</small>
        <p>${p.excerpt}</p>
      </div>
    `;
  });
  document.getElementById('posts').innerHTML = html;
});
</script>

</body>
</html>
