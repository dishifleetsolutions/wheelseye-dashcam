<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wheelseye Dashcam</title>

<style>
body {
  margin:0;
  font-family: Arial;
  background:#0a0f2e;
  color:white;
  text-align:center;
}

/* HERO */
.hero {
  padding:60px 20px;
}
.hero h1 {
  font-size:36px;
}
.hero span {
  color:#00d4ff;
}
.hero p {
  color:#ccc;
}
.btn {
  background:#e8192c;
  padding:14px 28px;
  color:white;
  text-decoration:none;
  display:inline-block;
  margin-top:20px;
  border-radius:5px;
}

/* VIDEO */
.video {
  padding:40px 20px;
}
.video iframe {
  width:100%;
  max-width:600px;
  height:300px;
  border-radius:10px;
}

/* FORM */
.form {
  padding:40px 20px;
}
.form input {
  padding:12px;
  margin:8px;
  width:90%;
  max-width:300px;
  border-radius:5px;
  border:none;
}
.form button {
  padding:12px 20px;
  background:#e8192c;
  color:white;
  border:none;
  border-radius:5px;
}

/* WHATSAPP */
.whatsapp {
  position:fixed;
  bottom:20px;
  right:20px;
  background:#25D366;
  padding:14px 18px;
  border-radius:30px;
  color:white;
  text-decoration:none;
  font-weight:bold;
}

/* TICKER */
.ticker {
  position:fixed;
  bottom:80px;
  left:20px;
  background:black;
  padding:10px 15px;
  border-radius:20px;
  font-size:13px;
  opacity:0.9;
}
</style>
</head>

<body>

<!-- HERO -->
<div class="hero">
  <h1>WHEELS EYE <span>DASHCAM</span></h1>
  <p>Live tracking with inbuilt SIM. No hotspot needed.</p>
  <a href="#form" class="btn">Get Demo</a>
</div>

<!-- VIDEO -->
<div class="video">
  <h2>Live Demo</h2>
  <iframe src="https://www.youtube.com/embed/YOUR_VIDEO_ID" allowfullscreen></iframe>
</div>

<!-- FORM -->
<div class="form" id="form">
  <h2>Get Free Demo</h2>
  <form id="leadForm">
    <input type="text" name="name" placeholder="Your Name" required><br>
    <input type="tel" name="phone" placeholder="Mobile Number" required><br>
    <button type="submit">Submit</button>
  </form>
</div>

<!-- BLOG -->
<div style="padding:30px;">
  <a href="/blog/" class="btn">Read Blog</a>
</div>

<!-- WHATSAPP -->
<a href="https://wa.me/919851991099" class="whatsapp">Chat</a>

<!-- TICKER -->
<div class="ticker" id="ticker">Loading...</div>

<script>
// GOOGLE SHEET
document.getElementById("leadForm").addEventListener("submit", function(e){
  e.preventDefault();

  fetch("YOUR_WEB_APP_URL", {
    method:"POST",
    body: JSON.stringify({
      name:this.name.value,
      phone:this.phone.value
    })
  }).then(()=>alert("Submitted Successfully"));
});

// TICKER FIXED
const names = ["Rahul","Amit","Suresh","Ravi"];
const cities = ["Kolkata","Delhi","Mumbai","Patna"];

function updateTicker(){
  const name = names[Math.floor(Math.random()*names.length)];
  const city = cities[Math.floor(Math.random()*cities.length)];
  document.getElementById("ticker").innerText =
    `🔥 ${name} from ${city} just booked`;
}
setInterval(updateTicker,4000);
updateTicker();
</script>

</body>
</html>
